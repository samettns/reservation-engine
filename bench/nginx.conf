# Load balancer in front of the three app instances (round robin).
worker_processes auto;
worker_rlimit_nofile 65535;
# warn, not the default error: "upstream server temporarily disabled" (an ejection by the passive
# health check) is logged at warn level, and bench/verify-failfast-live.sh counts it.
error_log /dev/stderr warn;

events {
    # 5,000 k6 virtual users each keep a connection to nginx, plus upstream connections.
    worker_connections 20000;
}

http {
    access_log off;

    # Passive health checks (open-source nginx cannot probe, and does not read Docker's health
    # status). A server with max_fails failures within fail_timeout gets no traffic for
    # fail_timeout, then one trial request.
    #
    # The threshold must tell SLOW from DEAD. With max_fails=1 (stage 7a, first try) a single
    # connect timeout under a connection burst ejected healthy, merely overloaded instances; when all
    # three were out, every request got an instant 502 (8 of 10 runs without load shedding). A
    # frozen instance, on the other hand, fails MANY requests at once (every request stuck on it
    # times out after proxy_read_timeout), so a higher threshold still catches it.
    upstream app {
        # Shared memory: one failure state for all worker processes (otherwise each worker counts
        # and ejects on its own). Measured cost of passive detection with a frozen instance and
        # 100 clients: ~100 requests time out: until the first one times out, round robin keeps
        # sending new requests there. Only ACTIVE checks (HAProxy, Envoy, nginx Plus) avoid that.
        zone app 64k;
        server app1:8080 max_fails=10 fail_timeout=10s;
        server app2:8080 max_fails=10 fail_timeout=10s;
        server app3:8080 max_fails=10 fail_timeout=10s;
        # Reuse upstream connections; otherwise every request pays a new TCP handshake
        # to the app and the benchmark measures nginx connection churn.
        keepalive 300;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # What counts as a failure for max_fails (with "off", nothing did: a dead instance kept
            # getting traffic). nginx never re-sends a POST that already reached an instance
            # (that needs "non_idempotent"); it only moves a request that could not be delivered
            # at all (connection refused) to the next instance, which is always safe.
            proxy_next_upstream error timeout;
            # A busy instance may accept late (full accept queue); 2 s turned that into failures.
            proxy_connect_timeout 10s;
            # Longer than any legitimate answer (with load shedding p99 is a few seconds), so only
            # a hung instance trips it. The default is 60 s.
            proxy_read_timeout 15s;
        }
    }
}
