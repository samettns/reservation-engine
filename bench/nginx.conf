# Load balancer in front of the three app instances (round robin).
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # 5,000 k6 virtual users each keep a connection to nginx, plus upstream connections.
    worker_connections 20000;
}

http {
    access_log off;

    upstream app {
        server app1:8080;
        server app2:8080;
        server app3:8080;
        # Reuse upstream connections; otherwise every request pays a new TCP handshake
        # to the app and the benchmark measures nginx connection churn.
        keepalive 300;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Do not retry a reservation on another instance: POST is not idempotent at
            # the HTTP level, and a silent retry would hide failures from the benchmark.
            proxy_next_upstream off;
        }
    }
}
