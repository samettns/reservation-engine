# Load balancer in front of the three app instances (round robin).
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # 5,000 k6 virtual users each keep a connection to nginx, plus upstream connections.
    worker_connections 20000;
}

http {
    access_log off;

    # Passive health checks (open-source nginx cannot probe, and does not read Docker's health
    # status): a server that fails once (connection error, or no answer within proxy_read_timeout)
    # gets no traffic for 10 s, then one trial request.
    upstream app {
        # Shared memory: one failure state for all worker processes (otherwise each worker
        # discovers a dead server on its own). Measured cost of passive detection with a frozen
        # instance and 100 clients: ~100 requests time out (122 without the zone, 102 with it):
        # until the first request times out (proxy_read_timeout), round robin keeps sending new
        # requests there, so roughly every client gets one request stuck. Only ACTIVE checks
        # (HAProxy, Envoy, nginx Plus) or a shorter read timeout reduce that.
        zone app 64k;
        server app1:8080 max_fails=1 fail_timeout=10s;
        server app2:8080 max_fails=1 fail_timeout=10s;
        server app3:8080 max_fails=1 fail_timeout=10s;
        # Reuse upstream connections; otherwise every request pays a new TCP handshake
        # to the app and the benchmark measures nginx connection churn.
        keepalive 300;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # What counts as a failure for max_fails (with "off", nothing did: a dead instance kept
            # getting traffic). nginx never re-sends a POST that already reached an instance
            # (that needs "non_idempotent"); it only moves a request that could not be delivered
            # at all (connection refused) to the next instance, which is always safe.
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            # Longer than any legitimate answer (with load shedding p99 is a few seconds), so only
            # a hung instance trips it. The default is 60 s.
            proxy_read_timeout 15s;
        }
    }
}
