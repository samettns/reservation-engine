# Local infrastructure.
#
#   docker compose up -d                  # PostgreSQL, Redis, Kafka (app runs on the host)
#   docker compose --profile bench up -d  # + 3 app instances behind nginx (benchmark setup)
#   docker compose down -v                # stop and delete data
#
# The benchmark (bench/run-all.sh) starts only postgres, redis, app1-3 and nginx, so
# Kafka does not compete for CPU/RAM during measurements.

x-app: &app
  image: reservation-engine:bench
  profiles: ["bench"]
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/reservation
    REDIS_HOST: redis
    RESERVATION_STRATEGY: ${RESERVATION_STRATEGY:-atomic}
    # 3 instances x 20 = 60 connections, below PostgreSQL's default max_connections (100).
    DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    HOLD_TTL: ${HOLD_TTL:-PT10M}
    EXPIRY_INTERVAL: ${EXPIRY_INTERVAL:-PT1S}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    # Benchmarks run without Kafka and set this to false (relay + consumer off; outbox rows are still written).
    EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
    interval: 3s
    timeout: 3s
    retries: 30

services:
  # Instances are also published on 8081-8083 so the benchmark can scrape each one's
  # /actuator/prometheus directly (through nginx you would hit a random instance).
  # Only app1 builds the image; app2/app3 reuse it (three builds of one tag would conflict).
  app1:
    <<: *app
    build: .
    ports: ["8081:8080"]
  app2:
    <<: *app
    pull_policy: never
    ports: ["8082:8080"]
  app3:
    <<: *app
    pull_policy: never
    ports: ["8083:8080"]

  nginx:
    image: nginx:1.27-alpine
    profiles: ["bench"]
    ports: ["8000:80"]
    volumes:
      - ./bench/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile: 65535
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners:
  #   kafka:19092     -> for other containers on the compose network
  #   localhost:9092  -> for the app running on the host
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres-data:
