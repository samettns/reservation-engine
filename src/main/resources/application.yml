spring:
  application:
    name: reservation-engine

  # Every request runs on its own virtual thread. Note: this does NOT raise the
  # number of concurrent DB operations; the Hikari pool below is the real limit.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USER:reservation}
    password: ${DB_PASSWORD:reservation}
    hikari:
      # Set explicitly (default is 10) because it is one of the main knobs in the benchmarks.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mvc:
    # RFC 9457 (Problem Details) bodies for framework errors such as a missing header.
    problemdetails:
      enabled: true

reservation:
  # naive | atomic | optimistic | pessimistic | redis
  strategy: ${RESERVATION_STRATEGY:atomic}
  optimistic:
    # Attempts per request before giving up with 503. Each attempt re-reads the row.
    max-attempts: ${OPTIMISTIC_MAX_ATTEMPTS:10}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
