spring:
  application:
    name: reservation-engine

  # Every request runs on its own virtual thread. Note: this does NOT raise the
  # number of concurrent DB operations; the Hikari pool below is the real limit.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USER:reservation}
    password: ${DB_PASSWORD:reservation}
    hikari:
      # Set explicitly (default is 10) because it is one of the main knobs in the benchmarks.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Creating topics at startup needs a broker; skipped when events are disabled (benchmarks).
      auto-create: ${EVENTS_ENABLED:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait until the broker has stored the message; the relay marks rows published only after that.
      acks: all
      properties:
        # Producer-level idempotence: Kafka's own internal retries can neither duplicate a message
        # nor reorder messages within a partition. (It does NOT cover our relay re-sending a batch
        # after a crash; consumers handle that with the inbox.)
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # Offsets are committed by the listener container after the handler returns.
      enable-auto-commit: false

  mvc:
    # RFC 9457 (Problem Details) bodies for framework errors such as a missing header.
    problemdetails:
      enabled: true

reservation:
  # naive | atomic | optimistic | pessimistic | redis
  strategy: ${RESERVATION_STRATEGY:atomic}
  optimistic:
    # Attempts per request before giving up with 503. Each attempt re-reads the row.
    max-attempts: ${OPTIMISTIC_MAX_ATTEMPTS:10}
  # How long a reservation is held for payment before it expires and the unit returns to stock.
  hold-ttl: ${HOLD_TTL:PT10M}
  idempotency:
    # An IN_PROGRESS claim older than this is considered abandoned (its owner crashed) and can be
    # taken over by a retry of the same request.
    lease: ${IDEMPOTENCY_LEASE:PT30S}
  expiry:
    enabled: ${EXPIRY_ENABLED:true}
    # Every instance sweeps; they split the work with FOR UPDATE SKIP LOCKED.
    interval: ${EXPIRY_INTERVAL:PT1S}
    batch-size: ${EXPIRY_BATCH_SIZE:200}
  events:
    # EVENTS_ENABLED=false turns off the relay and the consumer (outbox rows are still written).
    relay:
      enabled: ${EVENTS_ENABLED:true}
      interval: ${OUTBOX_RELAY_INTERVAL:PT0.2S}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
    consumer:
      enabled: ${EVENTS_ENABLED:true}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
